[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dagster-threaded-executor"
version = "0.2.0"
description = "Run independent Dagster steps concurrently in one worker process."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["dagster>=1.10,<1.14"]

[project.optional-dependencies]
benchmark = [
    "dagster==1.13.31",
    "dagster-async-executor==0.0.4",
    "google-cloud-bigquery==3.47.0",
    "matplotlib>=3.8",
    "psutil>=5.9",
]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/gajop/dagster-threaded-executor"
Issues = "https://github.com/gajop/dagster-threaded-executor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dagster_threaded_executor"]
