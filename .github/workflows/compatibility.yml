name: Compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dagster:
          - "dagster==1.10.0"
          - "dagster==1.11.0"
          - "dagster==1.12.0"
          - "dagster==1.13.0"
          - "dagster>=1.13,<1.14"
    env:
      DAGSTER_REQUIREMENT: ${{ matrix.dagster }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install ".[test]" "$DAGSTER_REQUIREMENT"
      - run: python -m pytest -q
